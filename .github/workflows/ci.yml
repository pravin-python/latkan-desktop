name: CI

on:
  push:
    branches: ["**"] # tag pushes are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt runtime libraries the PySide6 wheels expect on a bare Ubuntu runner (xcb, EGL/GL, fonts, D-Bus)
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install Latkan with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest, offscreen Qt)
        run: python -m pytest

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt runtime libraries the PySide6 wheels expect on a bare Ubuntu runner (xcb, EGL/GL, fonts, D-Bus)
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install Latkan with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Build (icons -> PyInstaller -> OS package)
        run: python scripts/build.py

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: latkan-${{ runner.os }}-${{ runner.arch }}
          path: dist/Latkan-*
          if-no-files-found: error
          retention-days: 14
